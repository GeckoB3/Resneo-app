name: CI

# Lint + the Jest suite + a typecheck gate every PR.
#
# `tsc` needs Expo's generated `expo-env.d.ts` + `.expo/types` (typed routes),
# which are gitignored and absent on a clean checkout. The "Generate Expo types"
# step regenerates them as a side effect of a web export (dummy public env is
# fine — Supabase only throws when the client is first *used*, not at import).
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci
      - name: Generate Expo types
        run: npx expo export --platform web --output-dir .expo-typecheck-export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key
          EXPO_PUBLIC_API_URL: https://example.com
      - name: Typecheck
        run: npm run typecheck
